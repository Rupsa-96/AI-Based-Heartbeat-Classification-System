services:
  - type: web
    name: heartguard-backend
    runtime: python
    buildCommand: bash backend/build.sh
    startCommand: bash backend/start.sh
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYENV_ROOT
        value: /opt/render/.pyenv
      - key: MODEL_DIR
        value: /opt/render/project/src/backend/model
      - key: DATA_DIR
        value: /opt/render/project/src/data
      - key: FRONTEND_URL
        value: https://heartguard-frontend.onrender.com
    autoDeploy: yes

  - type: web
    name: heartguard-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://heartguard-backend.onrender.com
    autoDeploy: yes
