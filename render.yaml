services:
  - type: web
    name: heartguard-backend
    runtime: python
    rootDir: backend
    buildCommand: bash build.sh
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MODEL_DIR
        value: /opt/render/project/src/backend/model
      - key: DATA_DIR
        value: /opt/render/project/src/backend/data
      - key: FRONTEND_URL
        value: https://heartguard-frontend.onrender.com

  - type: web
    name: heartguard-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://heartguard-backend.onrender.com
